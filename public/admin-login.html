<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>拾光集 · 管理登录</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="topnav">
    <div class="container">
      <a class="site" href="/">拾光集</a>
      <nav><a href="/">返回前台</a></nav>
    </div>
  </header>
  <main class="container" style="max-width: 400px;">
    <div class="article" style="padding: 28px;">
      <h1 style="font-size: 22px;">管理登录</h1>
      <form id="form">
        <div class="field">
          <label for="password">管理员密码</label>
          <input class="input" type="password" id="password" placeholder="本地默认：admin123" />
        </div>
        <div class="error-msg" id="error"></div>
        <button class="btn primary" type="submit" style="width: 100%;">登 录</button>
      </form>
    </div>
  </main>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      try {
        await api('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        location.href = '/admin.html';
      } catch (err) {
        error.textContent = err.message;
      }
    });
  </script>
</body>
</html>
