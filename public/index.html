<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>拾光集 · 首页</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="topnav">
    <div class="container">
      <a class="site" href="/">拾光集</a>
      <nav>
        <a href="/" class="active">首页</a>
        <a href="/archive.html">归档</a>
        <a href="/tags.html">标签</a>
        <a href="/about.html">关于</a>
        <a href="/search.html">搜索</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <h1 class="page-title" id="title">最新文章</h1>
    <div id="posts"></div>
    <div class="pagination" id="pagination"></div>
  </main>
  <footer><div class="container">© 2026 拾光集 · Powered by Cloudflare Workers</div></footer>
  <script src="/js/main.js"></script>
  <script>
    (async () => {
      const p = new URLSearchParams(location.search);
      const page = Number(p.get('page')) || 1;
      const category = p.get('category');
      const tag = p.get('tag');
      const data = await api('/api/posts?' + qs({ page, size: 10, category, tag }));
      if (category) document.getElementById('title').textContent = '分类：' + category;
      if (tag) document.getElementById('title').textContent = '标签：' + tag;
      renderPostList(document.getElementById('posts'), data.items, '还没有文章');
      renderPagination(document.getElementById('pagination'), data, (n) =>
        '/?' + qs({ page: n, category, tag }));
    })().catch((e) => {
      document.getElementById('posts').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    });
  </script>
</body>
</html>
